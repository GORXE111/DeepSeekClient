<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek Client</title>
<style>
  /* 像素宠物。
     宠物是 64×64 的序列帧整数放大的（见 pet-sprite.js），不是矢量图缩放 ——
     后者放大后边缘会被插值糊掉，那就不是像素风了。

     窗口尺寸永远贴着可见内容（三档：静默 / 冒泡 / 展开）。透明区域一样会拦住
     下面的点击，要绕开得靠 setIgnoreMouseEvents 加逐帧命中测试；窗口贴着内容长，
     这个问题根本不存在。 */
  html, body {
    margin: 0; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font: 13px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; box-sizing: border-box;
    -webkit-app-region: drag;
  }

  .tank {
    flex: none; align-self: center; position: relative;
    width: 128px; height: 128px;
    cursor: grab;
    -webkit-app-region: no-drag;
    /* 整体上下浮动。这一层是 CSS，因为“轻轻起伏”是位移而不是形变 ——
       把它也做进逐帧里会让每帧都要重画一遍位置，白费。 */
    animation: bob 3.4s ease-in-out infinite;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    /* 放大时保持硬边，这一句是像素风的命门。 */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }

  /* 被拎起来：停掉自在的起伏，改成小幅摇晃，并压一层投影表示离了地。
     摇晃配合 shy 那条序列帧一起看才像“被抓住了在扭”，单独用任一层都偏静。 */
  body.dragging .tank {
    cursor: grabbing;
    animation: struggle .3s ease-in-out infinite;
    filter: drop-shadow(0 8px 12px rgba(0,0,0,.4));
  }
  @keyframes struggle {
    0%   { transform: rotate(-7deg) scale(1.05) }
    50%  { transform: rotate(5deg) scale(1.05) }
    100% { transform: rotate(-7deg) scale(1.05) }
  }

  @media (prefers-reduced-motion: reduce) {
    body.dragging .tank { animation: none; transform: rotate(-6deg) }
  }

  body.state-running .tank { animation-duration: 2.4s }
  body.state-attention .tank { filter: drop-shadow(0 0 8px var(--accent, #5b7cff)) }

  .bubble, .panel {
    flex: 1; min-width: 0;
    padding: 10px 13px;
    background: rgba(20, 24, 31, .96);
    color: #e9ebef;
    box-shadow: 0 8px 26px rgba(0,0,0,.36);
    opacity: 0; transform: translateX(-8px) scale(.94);
    transform-origin: left center;
    transition: opacity 160ms ease, transform 200ms cubic-bezier(.2,.9,.3,1.25);
  }
  /* 气泡也走像素风：直角 + 硬边描边，圆角会和宠物打架。 */
  .bubble {
    /* 总结可能长过气泡：让它滚而不是裁掉。裁掉是无声的信息丢失，滚动至少
       让人知道下面还有。 */
    max-height: 100%;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.55;
    border-radius: 0;
    box-shadow: 0 0 0 3px rgba(20,24,31,.96), 0 0 0 6px var(--accent, #5b7cff), 0 8px 26px rgba(0,0,0,.36);
    pointer-events: none;
  }
  body.bubbling .bubble { opacity: 1; transform: none }
  .bubble.hidden, .panel.hidden { display: none }

  .panel {
    display: flex; align-items: center; gap: 8px;
    border-radius: 0;
    box-shadow: 0 0 0 3px rgba(20,24,31,.96), 0 0 0 6px var(--accent, #5b7cff), 0 8px 28px rgba(0,0,0,.38);
    pointer-events: none;
    -webkit-app-region: no-drag;
  }
  body.open .panel { opacity: 1; transform: none; pointer-events: auto }

  input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: #e9ebef; font: inherit; padding: 4px 2px;
  }
  input::placeholder { color: #7b828f }
  .send {
    flex: none; width: 26px; height: 26px; display: grid; place-items: center;
    border: 0; border-radius: 0; background: var(--accent, #5b7cff);
    color: #fff; cursor: pointer; font: 600 13px/1 monospace;
    transition: opacity 140ms ease;
  }
  .send:disabled { opacity: .35; cursor: default }

  @media (prefers-reduced-motion: reduce) {
    .tank { animation: none }
    .bubble, .panel { transition: none }
  }
</style>
</head>
<body class="state-idle">
  <div class="tank" id="tank"><canvas id="cv"></canvas></div>
  <div class="bubble hidden" id="bubble"></div>
  <div class="panel hidden" id="panel">
    <input id="input" type="text" placeholder="说点什么…" autocomplete="off" spellcheck="false">
    <button class="send" id="send" disabled aria-label="发送">▶</button>
  </div>

<script src="./pet-sprite.js"></script>
<script>
  const ACCENT = { idle: '#6f9bd1', running: '#5b7cff', attention: '#e0902b' }
  // 单帧 64px，放大 2 倍到 128px 显示。CSS 尺寸必须与 canvas 像素尺寸一致 ——
  // 不一致时浏览器会再缩放一次，把刚放大的硬边重新插值糊掉。
  const SCALE = 2

  const body = document.body
  const tank = document.getElementById('tank')
  const bubble = document.getElementById('bubble')
  const panel = document.getElementById('panel')
  const input = document.getElementById('input')
  const send = document.getElementById('send')
  const cv = document.getElementById('cv')
  const ctx = cv.getContext('2d')

  const { FRAME, FRAMES, load, draw: drawSprite } = globalThis.__dshSprite
  cv.width = FRAME * SCALE
  cv.height = FRAME * SCALE

  /* ── 动画调度 ──────────────────────────────────────────────────────────
     两层：**底色**一直循环，**一次性**插在上面播一轮就让位。

     没有第三种情况 —— 一次性动画放完必定落回底色，底色没被改过就是 idle。
     这样“任何时候没有在播别的就是 idle”是结构上保证的，而不是靠每个调用点
     自己记得复位。

     用 setTimeout 递归而不是 setInterval：每条动画的节奏不一样（困倦要慢、
     鼓掌要快），而 idle 还要在一轮眨眼之后停一会儿再眨 —— 定长间隔表达不了
     这些。逐帧重排定时器听着啰嗦，但省掉了一整套“改速率就得重建 interval”的
     状态管理。 */

  /** 各动画的单帧毫秒数。像素动画的味道来自帧率低而稳定，别跟着刷新率跑。 */
  const RATE = {
    idle: 170, thinking: 260, sleepy: 430, wave: 190,
    shy: 210, happy: 200, clap: 170, sad: 260,
  }

  /** 认得的动画名。只用来挡拼错的名字，不区分类别 —— 是底色还是插播由调用方决定。 */
  const ANIMS = new Set(globalThis.__dshSprite.ANIMS)

  /** 主进程推来的状态 → 底色动画。状态名沿用旧约定，映射只此一处。 */
  const BASE_OF = { idle: 'idle', running: 'thinking', attention: 'wave' }

  /** 当前底色。 */
  let base = 'idle'

  /** 正在插播的一次性动画；没有则为 null。 */
  let shot = null

  let frame = 0
  let timer = null

  /** 眼下真正该画哪条。 */
  const current = () => shot ?? base

  const draw = () => { drawSprite(ctx, current(), frame, SCALE) }

  /** 眨完一轮之后停多久。带随机是因为等间隔的眨眼一眼就看得出是机器。 */
  const idleHold = () => 2600 + Math.random() * 3400

  const schedule = (ms) => { clearTimeout(timer); timer = setTimeout(step, ms) }

  const step = () => {
    const anim = current()
    frame = (frame + 1) % FRAMES
    draw()
    if (frame === 0) {
      // 一次性动画放到头就让位，并立刻把底色的第 0 帧画出来 —— 否则会留着
      // 上一条的末帧空等一个间隔，看着像卡了一下。
      if (shot !== null) { shot = null; draw(); schedule(RATE[base] ?? 220); return }
      // idle 那条是眨眼，连着播就是规律抽搐；放完一轮停一会儿才像在发呆。
      if (anim === 'idle') { schedule(idleHold()); return }
    }
    schedule(RATE[anim] ?? 220)
  }

  /** 换底色。同一条就不打断，免得状态被重复推送时动画总从头开始。 */
  const setBase = (next) => {
    if (next === base && shot === null) return
    base = next
    shot = null
    frame = 0
    draw()
    schedule(RATE[base] ?? 220)
  }

  /* ── 打盹 ───────────────────────────────────────────────────────────────
     长时间没人理就切到 sleepy。只在 idle 底色上生效：智能体正在跑的时候
     宠物去睡觉，等于把最该看的状态藏起来了。 */

  const NAP_AFTER = 4 * 60 * 1000
  let napTimer = null
  let napping = false

  const scheduleNap = () => {
    clearTimeout(napTimer)
    napTimer = setTimeout(() => {
      if (base === 'idle' && shot === null && !open && drag === null) {
        napping = true
        setBase('sleepy')
      }
    }, NAP_AFTER)
  }

  /** 任何互动都算把她叫醒。 */
  const wake = () => {
    if (napping) { napping = false; setBase('idle') }
    scheduleNap()
  }

  /**
   * 插播一次性动画。放完自动回到底色，调用方不需要善后。
   *
   * 哪条动画算"一次性"由调用方定，而不是查一张固定的表：同一条 wave，主进程用它
   * 当"打个招呼"（插播一轮），状态机用它当"等你处理"（一直招手）—— 意图在调用点，
   * 表里写死只会逼着两边挑不同的素材。
   *
   * @param {string} anim 动画名；不认得的一律忽略
   */
  window.__dshPetPlay = (anim) => {
    if (!ANIMS.has(anim)) return
    wake()
    shot = anim
    frame = 0
    draw()
    schedule(RATE[anim] ?? 220)
  }

  // 素材是异步解码的，加载完再画第一帧 —— 否则首帧是一张空画布。
  // 画得出来了才报到：主进程收到 ready 就会把当前状态推过来，早报到等于让那一
  // 帧落在还没解码完的画布上。
  void load().then(() => {
    draw()
    schedule(RATE.idle)
    window.__dshPet?.ready()
  })
  scheduleNap()

  // 主进程 → 页面的三条推送。函数体仍挂在 window 上：它们是这个页面的对外接口，
  // 测试直接调它们来驱动，不必绕一圈假 IPC。
  window.__dshPet?.onState((s) => { window.__dshPetState(s) })
  window.__dshPet?.onPlay((a) => { window.__dshPetPlay(a) })
  window.__dshPet?.onSay((t, ms) => { void window.__dshPetSay(t, ms) })

  /**
   * 状态由主进程推送：宠物、托盘、通知看同一份状态，不各自推断。
   */
  window.__dshPetState = (next) => {
    const state = next ?? 'idle'
    document.documentElement.style.setProperty('--accent', ACCENT[state] ?? ACCENT.idle)
    body.classList.remove('state-idle', 'state-running', 'state-attention')
    body.classList.add(`state-${state}`)
    napping = false
    scheduleNap()
    // 拖拽中的姿态归拖拽管，状态推送不该把它抢回去。
    if (drag === null) setBase(BASE_OF[state] ?? 'idle')
  }

  let bubbleTimer
  let open = false

  /**
   * 弹一句话。展开输入时不弹 —— 那会把输入框挤走，而且用户正在打字。
   * 气泡自动消失：一条永远挂在桌面上的提示很快就变成视觉噪音。
   */
  window.__dshPetSay = async (text, ms = 4200) => {
    if (open || typeof text !== 'string' || text === '') return
    wake()
    clearTimeout(bubbleTimer)
    bubble.textContent = text
    bubble.classList.remove('hidden')
    await window.__dshPet?.resize('bubble')
    requestAnimationFrame(() => { body.classList.add('bubbling') })
    bubbleTimer = setTimeout(hideBubble, ms)
  }

  const hideBubble = () => {
    if (!body.classList.contains('bubbling')) return
    body.classList.remove('bubbling')
    setTimeout(async () => {
      bubble.classList.add('hidden')
      if (!open) await window.__dshPet?.resize('idle')
    }, 200)
  }

  /**
   * 展开与收起。顺序有讲究：展开先放大窗口、下一帧再加 class，否则浏览器会把
   * 尺寸变化和 class 合成一次布局，动画直接被跳过；收起反过来，先播退场再缩窗口。
   */
  const setOpen = async (next) => {
    if (next === open) return
    open = next
    wake()
    if (open) {
      clearTimeout(bubbleTimer)
      body.classList.remove('bubbling')
      bubble.classList.add('hidden')
      panel.classList.remove('hidden')
      await window.__dshPet?.resize('open')
      requestAnimationFrame(() => { body.classList.add('open'); input.focus() })
    } else {
      body.classList.remove('open')
      input.value = ''
      send.disabled = true
      setTimeout(async () => {
        panel.classList.add('hidden')
        await window.__dshPet?.resize('idle')
      }, 200)
    }
  }

  /**
   * 按住宠物拖动。
   *
   * 自绘而不是交给 `-webkit-app-region: drag`：系统拖拽会把鼠标事件整个吞掉，页面
   * 因此不知道自己正被拖，也就播不了被拎起来的动画。
   *
   * 用指针捕获而不是在 window 上听 mousemove：拖动中光标经常跑到这个小窗口之外，
   * 没有捕获就会中途断流，宠物卡在半路。
   *
   * 传增量而不是绝对坐标：窗口本身在跟着移动，用窗口内坐标推算目标位置会和上一帧
   * 的位移叠加，宠物会自己飞出屏幕。
   */
  const DRAG_SLOP = 4
  let drag = null

  /** 松手后该回到哪条底色。拖拽期间状态可能变过，不能一律回 idle。 */
  let baseBeforeDrag = 'idle'

  tank.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return
    e.preventDefault()
    tank.setPointerCapture(e.pointerId)
    drag = { x: e.screenX, y: e.screenY, travelled: 0 }
    baseBeforeDrag = base
    body.classList.add('dragging')
    wake()
    setBase('shy')
  })

  tank.addEventListener('pointermove', (e) => {
    if (drag === null) return
    const dx = e.screenX - drag.x
    const dy = e.screenY - drag.y
    if (dx === 0 && dy === 0) return
    drag.travelled += Math.abs(dx) + Math.abs(dy)
    drag.x = e.screenX
    drag.y = e.screenY
    window.__dshPet?.moveBy(dx, dy)
  })

  const endDrag = () => {
    if (drag === null) return
    // 手一抖也算按下，所以低于这点位移的一律当点击 —— 否则想点开却总是“拖了一下”。
    const tapped = drag.travelled <= DRAG_SLOP
    drag = null
    body.classList.remove('dragging')
    // 打盹时被拎起来，放下就当醒了 —— 刚被折腾完立刻接着睡说不过去。
    setBase(baseBeforeDrag === 'shy' || baseBeforeDrag === 'sleepy' ? 'idle' : baseBeforeDrag)
    napping = false
    scheduleNap()
    if (tapped) void setOpen(!open)
  }
  tank.addEventListener('pointerup', endDrag)
  tank.addEventListener('pointercancel', endDrag)

  tank.addEventListener('contextmenu', (e) => { e.preventDefault(); window.__dshPet?.menu() })
  input.addEventListener('input', () => { send.disabled = input.value.trim() === '' })

  const submit = async () => {
    const text = input.value.trim()
    if (text === '') return
    input.value = ''
    send.disabled = true
    const result = await window.__dshPet?.ask(text)
    await setOpen(false)
    if (result && result.ok === false) {
      window.__dshPetPlay('sad')
      setTimeout(() => { void window.__dshPetSay(result.error ?? '发送失败', 6000) }, 320)
    }
  }

  send.addEventListener('click', () => { void submit() })
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); void submit(); return }
    if (e.key === 'Escape') { e.preventDefault(); void setOpen(false) }
  })
  window.addEventListener('blur', () => { if (open) void setOpen(false) })
</script>
</body>
</html>
