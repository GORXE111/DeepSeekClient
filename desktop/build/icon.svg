<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    应用图标。

    刻意避开当下最常见的那套做法：亮色渐变圆角方块中间放一个字母。那个做法在
    任何应用商店里都撞脸，而且缩到 16px 时字母糊成一团。

    这里用深墨底 + 两枚交扣的环：交扣是"连接"的意思，也正是这个客户端在做的
    事 —— 把一个跑在本机的 agent 运行时接到你面前。两枚环用不同的笔触粗细与
    颜色，所以即使缩到任务栏尺寸，形状关系仍然读得出来，不依赖细节。

    深墨底在浅色与深色系统主题下都稳，单一冷调点缀比满屏渐变更耐看。
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2028"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <!-- 极轻的内发光，给平面一点体积感，不到"拟物"的程度。 -->
    <radialGradient id="sheen" cx="0.5" cy="0.30" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 后环的完整路径，遮罩与描边共用一份，避免两处几何各写一遍而走形。 -->
    <path id="backRing" d="M424 362a150 150 0 1 0 0 300 150 150 0 1 0 0-300Z"/>

    <!--
      交扣靠遮罩实现：前环整体压在后环之上，只在**一个**交点把它挖开，让后环
      从那里穿过去。两个交点都挖就成了"断开的环"，一个都不挖就只是"贴着"——
      真正的扣合恰恰是一处在前、一处在后。

      交点位置是算出来的而不是试出来的：两圆心 (424,512)、(600,512)，半径都是
      150，圆心距 176，故交点在 x=512、y=512±√(150²−88²)≈512±121.5。这里取上
      交点，挖口半径覆盖住后环 34 的笔触即可。
    -->
    <mask id="frontCut">
      <rect x="0" y="0" width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="390.5" r="34" fill="#000"/>
    </mask>
  </defs>

  <!-- squircle：曲率连续，两个系统的图标网格都更贴合。只画这一层。 -->
  <path fill="url(#ground)"
        d="M320 64h384c141.4 0 256 114.6 256 256v384c0 141.4-114.6 256-256 256H320C178.6 960 64 845.4 64 704V320C64 178.6 178.6 64 320 64Z"/>
  <path fill="url(#sheen)"
        d="M320 64h384c141.4 0 256 114.6 256 256v384c0 141.4-114.6 256-256 256H320C178.6 960 64 845.4 64 704V320C64 178.6 178.6 64 320 64Z"/>

  <!-- 后环：细笔触、低对比，退在后面。 -->
  <use href="#backRing" fill="none" stroke="#8e96a6" stroke-width="34" stroke-opacity="0.6"/>

  <!-- 前环：粗笔触、点缀色；遮罩挖出的缺口让后环从中穿过。 -->
  <circle cx="600" cy="512" r="150" fill="none" stroke="#5b7cff" stroke-width="44"
          mask="url(#frontCut)"/>
</svg>
